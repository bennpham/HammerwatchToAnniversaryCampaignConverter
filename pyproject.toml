[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "hw2ae"
version = "0.1.0"
description = "Convert Hammerwatch 1 missions and campaigns into playable Hammerwatch Anniversary Edition scenarios"
readme = "README.md"
requires-python = ">=3.10"
# HW2A000FF ports HW1 art AE has no counterpart for (custom doodads, water, the
# castle/desert themes, floor buttons). Pinned so every machine converts alike.
# Pillow pads ported textures to the power-of-two sizes AE requires.
dependencies = [
    "pillow",
    "hw2a000ff @ git+https://github.com/bennpham/HW2A000FF-AllPlatform-Remake@089a782eb773e70edbf3957cfc565d65b93a32be",
]

[project.optional-dependencies]
preview = []  # Pillow is now a dependency
test = ["pytest"]
# Kept so older install commands still work; HW2A000FF is now a dependency.
port = []

[project.scripts]
hw2ae = "hw2ae.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"hw2ae.mapping" = ["data/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
